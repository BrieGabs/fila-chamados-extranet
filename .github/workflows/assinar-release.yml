# Assina o ZIP de cada release com Sigstore e anexa a procedência (de onde e como o ZIP foi gerado)
# O ZIP é refeito a partir da tag e só é assinado se for idêntico ao publicado na release
name: Assinar release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release a assinar (ex.: v1.1.0)'
        required: true

permissions:
  contents: read

jobs:
  assinar:
    name: Assinar o ZIP da release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write       # anexa a assinatura na release
      id-token: write       # identidade do workflow para o Sigstore
      attestations: write   # registra a procedência no GitHub
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Baixar o código da tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Refazer o ZIP e conferir com o publicado
        run: |
          git archive --prefix=fila-chamados/ -o fila-chamados.zip "$TAG"
          gh release download "$TAG" -p fila-chamados.zip -D publicado
          sha256sum fila-chamados.zip publicado/fila-chamados.zip
          cmp fila-chamados.zip publicado/fila-chamados.zip || { echo "::error::O ZIP da release não é idêntico ao gerado pela tag $TAG"; exit 1; }

      - name: Assinar e registrar a procedência
        id: procedencia
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: fila-chamados.zip

      - name: Anexar a assinatura na release
        env:
          BUNDLE: ${{ steps.procedencia.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" fila-chamados.zip.sigstore.json
          gh release upload "$TAG" fila-chamados.zip.sigstore.json --clobber
